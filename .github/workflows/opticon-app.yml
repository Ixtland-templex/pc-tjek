name: Opticon app (Windows-program)

on:
  push:
    branches: [ main ]
    paths:
      - 'opticon-app/**'
      - '.github/workflows/opticon-app.yml'
    tags: [ 'app-v*' ]
  pull_request:
    paths:
      - 'opticon-app/**'
      - '.github/workflows/opticon-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [ x64, arm64 ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Find version
        id: ver
        shell: pwsh
        run: |
          [xml]$p = Get-Content opticon-app/Opticon.csproj
          $v = @($p.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ })[0]
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build
        run: dotnet publish opticon-app/Opticon.csproj -c Release -r win-${{ matrix.arch }} --self-contained true -o out/win-${{ matrix.arch }}

      - name: Make installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DArch=${{ matrix.arch }}" "/DAppVer=${{ steps.ver.outputs.version }}" "/DSrc=$env:GITHUB_WORKSPACE\out\win-${{ matrix.arch }}" "/O$env:GITHUB_WORKSPACE\dist" opticon-app\installer\Opticon.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: Opticon-Setup-${{ matrix.arch }}
          path: dist/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/app-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          name: Opticon ${{ github.ref_name }}
          prerelease: true
